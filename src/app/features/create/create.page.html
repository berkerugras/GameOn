<section class="page"><p class="eyebrow">Yeni etkinlik</p><h1>Maç oluştur</h1><div class="steps"><b class="active">1</b><i></i><b>2</b><i></i><b>3</b></div><label>SPOR</label><div class="sports"><button [class.active]="sport()==='football'" (click)="sport.set('football')"><span>⚽</span>Futbol</button><button [class.active]="sport()==='basketball'" (click)="sport.set('basketball')"><span>🏀</span>Basketbol</button></div><div class="form card"><label>TAKIMIN<select [(ngModel)]="team"><option>Kadıköy United</option></select></label><div class="row"><label>TARİH<input [(ngModel)]="date" type="date"></label><label>SAAT<input [(ngModel)]="time" type="time"></label></div><label>FORMAT<select [(ngModel)]="format"><option>5v5</option><option>7v7</option><option>11v11</option></select></label><label>SAHA<select [(ngModel)]="venue"><option>Caddebostan Spor Parkı</option><option>Fenerbahçe Parkı</option><option>Kalamış Basketbol Sahası</option></select></label></div><div class="notice">🛡️ Yalnızca güvenilir oyuncular katılabilir. İptal geçmişi takım kaptanlarına görünür.</div><button class="primary publish" (click)="create()">Maçı yayınla →</button></section>
